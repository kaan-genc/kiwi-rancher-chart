        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent

          command:
            - /bin/sh
            - -c
          args:
            - |
              echo "Waiting for Kiwi uWSGI socket..."
              until [ -S /tmp/kiwitcms.sock ]; do
                sleep 2
              done
              chmod 777 /tmp/kiwitcms.sock
              echo "Socket found and permission fixed. Starting nginx..."
              exec nginx -g 'daemon off;'

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /accounts/login/
              port: http
            initialDelaySeconds: 90
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12

          livenessProbe:
            httpGet:
              path: /accounts/login/
              port: http
            initialDelaySeconds: 120
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12

          volumeMounts:
            - name: kiwi-socket
              mountPath: /tmp

            - name: media
              mountPath: {{ .Values.media.root | quote }}

            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
