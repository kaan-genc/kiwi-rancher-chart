apiVersion: v1
kind: Service
metadata:
  name: {{ include "kiwi.fullname" . }}-http
  labels:
    {{- include "kiwi.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port.http }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "kiwi.selectorLabels" . | nindent 4 }}
