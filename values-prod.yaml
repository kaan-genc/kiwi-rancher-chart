image:
  repository: kiwitcms/kiwi
  pullPolicy: IfNotPresent
  
service:
  type: ClusterIP
  port:
    http: 80
    https: 8443
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
  host: kiwi.tani.com.tr
  tls:
    enabled: false
    port: 443

resources:
  limits:
    cpu: "2"
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 1Gi

storage:
  persistent: true
  class: longhorn-retain
  size: 15Gi

media:
  root: "/Kiwi/uploads"
  url: "/uploads/"

email:
  from: "kiwi@example.com"
  subject: "[Kiwi-TCMS] "

database:
  type: postgres
  host: 10.190.205.6
  port: 5432
  internal: false
  db_name: kiwitcms
  username: kiwi
  existingSecret: kiwi-secret
